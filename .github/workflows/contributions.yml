name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DemiD3mon
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23d4d9df&color_dots=%23161b22,%23303841,%2357606a,%238b949e,%23c9d1d9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
